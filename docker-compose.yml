version: '3.8'

services:
  # ============================================================================
  # FarmFederate API Service
  # ============================================================================
  farmfederate-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: farmfederate:latest
    container_name: farmfederate-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./results:/app/results
    environment:
      - MODEL_PATH=/app/models/best_model.pt
      - CONFIDENCE_THRESHOLD=0.5
      - LOG_LEVEL=INFO
      - DEVICE=cpu  # Change to 'cuda' if GPU available
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================================================
  # Qdrant Vector Database (for RAG-enhanced inference)
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: farmfederate-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # ============================================================================
  # Redis Cache (for response caching)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: farmfederate-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ============================================================================
  # Nginx Reverse Proxy (for production load balancing)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: farmfederate-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - farmfederate-api

  # ============================================================================
  # Prometheus Monitoring (optional)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: farmfederate-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles:
      - monitoring

  # ============================================================================
  # Grafana Dashboard (optional)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: farmfederate-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    profiles:
      - monitoring

volumes:
  qdrant_storage:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: farmfederate-network
