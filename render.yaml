# Render deployment configuration for FarmFederate
# Deploy at: https://dashboard.render.com

services:
  - type: web
    name: farmfederate-api
    runtime: python
    region: oregon  # or singapore, frankfurt
    plan: free  # Change to 'starter' ($7/mo) for production with ML models
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: cd backend && uvicorn demo_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GIT_LFS_SKIP_SMUDGE
        value: "1"  # Skip downloading 847MB model checkpoint during clone
      - key: DEMO_MODE
        value: "true"  # Set to "false" if you upload models
    healthCheckPath: /health
    autoDeploy: true
