name: farmfederate_advisor
description: FarmFederate - network crop health advisory app for tea disease detection
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.1.0
  image_picker: ^1.0.4
  file_picker: ^8.0.0
  mqtt_client: ^10.0.0
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0
  provider: ^6.1.1
  flutter_svg: ^2.0.9
  platform: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
