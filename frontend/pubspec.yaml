name: farmfederate_advisor
description: FarmFederate - Multimodal Federated Learning for Privacy-Preserving Crop Stress Detection
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  http: ^1.1.0

  # Image handling
  image_picker: ^1.0.4
  file_picker: ^8.0.0

  # MQTT for IoT sensor data
  mqtt_client: ^10.0.0

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Firebase authentication
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0

  # Local storage
  shared_preferences: ^2.2.2

  # Charts for visualizations (paper figures)
  fl_chart: ^0.68.0

  # State management
  provider: ^6.1.1

  # Icons
  flutter_svg: ^2.0.9

  # Platform detection for mobile deployment
  platform: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
